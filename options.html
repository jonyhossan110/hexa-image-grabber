<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hexa Image Grabber — Settings</title>
<style>
  body { font: 15px/1.6 "Segoe UI", Arial, sans-serif; background:#141210; color:#f3ead9; margin:0; }
  .wrap { max-width:560px; margin:40px auto; padding:28px 30px; background:#1d1a17; border:1px solid #38312a; border-radius:14px; }
  h1 { font-size:20px; margin:0 0 4px; color:#D97757; }
  p.sub { margin:0 0 22px; color:#b9ab94; font-size:13.5px; }
  label { display:block; margin:16px 0 6px; font-weight:600; }
  .hint { color:#b9ab94; font-size:13px; font-weight:400; }
  input[type=text], input[type=number] { width:100%; box-sizing:border-box; padding:9px 11px; border-radius:8px; border:1px solid #4a4136; background:#100e0c; color:#f3ead9; font-size:15px; }
  .row { display:flex; align-items:center; gap:10px; margin-top:18px; }
  button { background:#D97757; color:#141210; border:0; padding:10px 18px; border-radius:9px; font-weight:700; cursor:pointer; font-size:14.5px; }
  button.ghost { background:transparent; color:#e08a6d; border:1px solid #6d4a3a; }
  #stats { margin-top:24px; padding:13px 15px; background:#100e0c; border-radius:9px; font-size:14px; color:#cfc2ab; }
  #msg { color:#9bc48b; min-height:20px; margin-top:10px; font-size:14px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Hexa Image Grabber — Settings</h1>
  <p class="sub">One click on the toolbar icon downloads the page's content images. Browser/UI icons, favicons and tiny images are ignored, and an image already saved once is never saved again.</p>

  <label>Minimum image size (pixels)
    <span class="hint">— images smaller than this in either dimension are treated as icons/UI and skipped. Default 120.</span>
  </label>
  <input type="number" id="minSize" min="1" max="2000" step="10">

  <label>Folder name (inside your Downloads folder)
    <span class="hint">— each website gets its own sub-folder, e.g. HexaImages\bbc.com\</span>
  </label>
  <input type="text" id="rootFolder">

  <div class="row">
    <input type="checkbox" id="includeBg" style="width:18px;height:18px;">
    <span>Also collect background images (hero banners, cards)</span>
  </div>

  <div class="row">
    <button id="save">Save settings</button>
    <button id="resetReg" class="ghost">Forget saved-image history</button>
  </div>
  <div id="msg"></div>

  <div id="stats">Loading history…</div>
</div>
<script src="options.js"></script>
</body>
</html>
